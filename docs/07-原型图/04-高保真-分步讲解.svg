<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
<defs>
  <linearGradient id="hgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#2563EB"/>
  </linearGradient>
</defs>
<rect width="375" height="812" fill="#F9FAFB"/>
<rect x="0" y="0" width="375" height="56" rx="0" fill="url(#hgrad)" opacity="1"/><circle cx="30" cy="28" r="16" fill="#FFFFFF22"/><text x="30" y="34" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">∑</text><text x="54" y="25" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start" opacity="1">分步讲解</text><text x="54" y="40" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="9.5" fill="#FFFFFF" font-weight="normal" text-anchor="start" opacity="0.85">不跳步地讲懂 · 顺着你的思路纠错</text><rect x="295" y="16" width="64" height="22" rx="11" fill="#FFFFFF30" opacity="1"/><text x="327.0" y="31" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#FFFFFF" font-weight="600" text-anchor="middle" opacity="1">一元一次方程</text><rect x="16" y="72" width="343" height="52" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" opacity="1"/><rect x="16" y="72" width="4" height="52" rx="2" fill="#2563EB" opacity="1"/><text x="30" y="92" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="9.5" fill="#6B7280" font-weight="normal" text-anchor="start" opacity="1">题目</text><text x="30" y="112" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="13" fill="#111827" font-weight="600" text-anchor="start" opacity="1">2x + 3 = 7，求 x</text><rect x="16" y="136" width="343" height="76" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><circle cx="38" cy="162" r="12" fill="#2563EB"/><text x="38" y="166" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">1</text><text x="58" y="158" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start" opacity="1">移项：把含 x 的项放左边</text><text x="58" y="174" font-family="Menlo, monospace" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">2x = 7 - 3</text><rect x="58" y="182" width="62" height="18" rx="9" fill="#F3F4F6" opacity="1"/><text x="89" y="195" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle" opacity="1">为什么 ▴</text><rect x="16" y="211" width="343" height="46" rx="0" fill="#FFFBEB" opacity="1"/><line x1="16" y1="211" x2="359" y2="211" stroke="#FDE68A" stroke-width="1"/><text x="58" y="228" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#78350F" font-weight="normal" text-anchor="start" opacity="1">为什么：等式两边同时减去 3，等式仍然成立。</text><text x="58" y="244" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#78350F" font-weight="normal" text-anchor="start" opacity="1">移项要变号，这是等式性质。</text><rect x="16" y="262" width="343" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><circle cx="38" cy="288" r="12" fill="#2563EB"/><text x="38" y="292" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">2</text><text x="58" y="284" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start" opacity="1">合并同类项，化简</text><text x="58" y="300" font-family="Menlo, monospace" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">2x = 4</text><rect x="58" y="308" width="62" height="18" rx="9" fill="#F3F4F6" opacity="1"/><text x="89" y="321" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle" opacity="1">为什么 ▾</text><rect x="16" y="346" width="343" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><circle cx="38" cy="372" r="12" fill="#2563EB"/><text x="38" y="376" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">3</text><text x="58" y="368" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start" opacity="1">系数化为 1：两边同除以 2</text><text x="58" y="384" font-family="Menlo, monospace" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">x = 2</text><rect x="58" y="392" width="62" height="18" rx="9" fill="#F3F4F6" opacity="1"/><text x="89" y="405" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle" opacity="1">为什么 ▾</text><rect x="16" y="430" width="343" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><circle cx="38" cy="456" r="12" fill="#2563EB"/><text x="38" y="460" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">4</text><text x="58" y="452" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start" opacity="1">检验</text><text x="58" y="468" font-family="Menlo, monospace" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">把 x = 2 代回原式，成立</text><rect x="58" y="476" width="62" height="18" rx="9" fill="#F3F4F6" opacity="1"/><text x="89" y="489" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle" opacity="1">为什么 ▾</text><rect x="60" y="522" width="255" height="34" rx="17" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" stroke-dasharray="5,4" opacity="1"/><text x="187" y="544" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11" fill="#92400E" font-weight="normal" text-anchor="middle" opacity="1">💡 展开答案（先自己想一想）</text><rect x="16" y="570" width="343" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" opacity="1"/><text x="187" y="598" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#2563EB" font-weight="600" text-anchor="middle" opacity="1">❌ 我的过程有错，帮我分析</text><rect x="16" y="628" width="343" height="116" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="32" y="652" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start" opacity="1">📚 同类题推荐（错一练三）</text><rect x="32" y="664" width="311" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="42" y="683" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">3x - 5 = 10，求 x</text><text x="329" y="683" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#2563EB" font-weight="600" text-anchor="end" opacity="1">讲解 ›</text><rect x="32" y="698" width="311" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="42" y="717" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">4x + 1 = 2x + 9，求 x</text><text x="329" y="717" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#2563EB" font-weight="600" text-anchor="end" opacity="1">讲解 ›</text>
</svg>