<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
<defs>
  <linearGradient id="hgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#2563EB"/>
  </linearGradient>
</defs>
<rect width="375" height="812" fill="#F9FAFB"/>
<rect x="0" y="0" width="375" height="56" rx="0" fill="url(#hgrad)" opacity="1"/><path d="M20 30 l7 -7 M20 30 l7 7" stroke="#FFFFFF" stroke-width="2" fill="none"/><text x="36" y="35" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" opacity="1">错因分析</text><rect x="16" y="72" width="343" height="48" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" opacity="1"/><rect x="16" y="72" width="4" height="48" rx="2" fill="#2563EB" opacity="1"/><text x="30" y="90" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="9.5" fill="#6B7280" font-weight="normal" text-anchor="start" opacity="1">题目</text><text x="30" y="108" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start" opacity="1">2x + 3 = 7，求 x</text><text x="32" y="146" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="start" opacity="1">我的过程 / 答案</text><rect x="32" y="156" width="311" height="72" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" opacity="1"/><text x="44" y="182" font-family="Menlo, monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" opacity="1">2x = 7 + 3</text><text x="44" y="204" font-family="Menlo, monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" opacity="1">x = 5</text><rect x="16" y="244" width="343" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" opacity="1"/><text x="187" y="272" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle" opacity="1">🔍 分析错因</text><rect x="16" y="304" width="343" height="190" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" opacity="1"/><rect x="32" y="320" width="96" height="22" rx="11" fill="#DC2626" opacity="1"/><text x="80" y="335" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">移项未变号</text><text x="32" y="364" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11.5" fill="#7F1D1D" font-weight="normal" text-anchor="start" opacity="1">你把常数 3 从左边移到右边时</text><text x="32" y="382" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11.5" fill="#7F1D1D" font-weight="normal" text-anchor="start" opacity="1">没有变号，正确应为 2x = 7 - 3。</text><rect x="32" y="396" width="311" height="0.8" rx="0" fill="#FECACA" opacity="1"/><text x="32" y="418" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11.5" fill="#14532D" font-weight="700" text-anchor="start" opacity="1">✅ 正确答案：x = 2</text><text x="32" y="442" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11" fill="#7F1D1D" font-weight="normal" text-anchor="start" opacity="1">💡 建议：移项要变号，可把负项用</text><text x="32" y="460" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="11" fill="#7F1D1D" font-weight="normal" text-anchor="start" opacity="1">括号包起来再计算。</text><rect x="32" y="472" width="100" height="0" rx="0" fill="#FEF2F2" opacity="1"/><text x="32" y="486" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start" opacity="1">错因类型：符号错误 / 移项未变号</text><text x="32" y="520" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start" opacity="1">📚 同类题推荐</text><rect x="32" y="532" width="311" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="42" y="551" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">3x - 5 = 10，求 x</text><text x="329" y="551" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#2563EB" font-weight="600" text-anchor="end" opacity="1">答案 ›</text><rect x="32" y="566" width="311" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="42" y="585" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start" opacity="1">5 - 2x = 1，求 x</text><text x="329" y="585" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="10" fill="#2563EB" font-weight="600" text-anchor="end" opacity="1">答案 ›</text><text x="32" y="620" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif" font-size="9.5" fill="#6B7280" font-weight="normal" text-anchor="start" opacity="1">💡 设计说明：错因定位到「具体步骤」而非只给答案（F3-AC1）</text>
</svg>